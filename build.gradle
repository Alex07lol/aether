// =============================================================================
// Aether - a real ForgeGradle 1.8.9 build (official FG 2.1 line)
//
// Toolchain (decisions recorded in docs/BUILD_PIPELINE_AUDIT.md):
//   Official ForgeGradle 2.1-SNAPSHOT (net.minecraftforge.gradle, last maintained
//   build 42, Nov 2021 - still resolvable from the Forge maven). The anatawa12
//   2.3 fork was tried first but is for the 1.12 era per its own README, and its
//   forgeflower decompiler output cannot be patched by 1.8.9's MCP patches
//   (43/57 failed in fixMcSources). FG 2.1 is the exact plugin the 1.8.9 MDK
//   shipped with and decompiles with the fernflower the patches expect.
//   MixinGradle 0.6-SNAPSHOT + Mixin 0.8.5 (Sponge maven), the target stack.
//   Java 8, Minecraft 1.8.9, Forge 11.15.1.2318, mappings stable_22.
//
// Everything the mod needs is now in ONE source set (main):
//   src/main/java  = common core (dev.aether.*) + Forge adapter (dev.aether.forge189.*)
//   src/main/resources = assets, mixins.aether.json, mcmod.info
// The old forge189/forge189Stubs source sets are gone: ForgeGradle supplies the
// real Minecraft/Forge classes at compile time, so there is nothing to stub.
//
// The old hand-written MCP->SRG remapper (dev.aether.remap) and the compile stubs
// (src/forge189Stubs) were deleted once this pipeline was proven: ForgeGradle supplies
// the real Minecraft/Forge classes and reobfJar does the production remapping.
// =============================================================================

buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "sponge"
            url = "https://repo.spongepowered.org/repository/maven-public"
        }
    }
    dependencies {
        classpath("net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT") {
            changing = true
        }
        classpath("org.spongepowered:mixingradle:0.6-SNAPSHOT") {
            changing = true
        }
    }
}

apply plugin: "net.minecraftforge.gradle.forge"
apply plugin: "org.spongepowered.mixin"

group = "dev.aether"
version = "0.1.0"

sourceCompatibility = targetCompatibility = "1.8"
compileJava {
    options.encoding = "UTF-8"
}

// ===========================================================================
// Mixin: the annotation processor reads the SRG mappings ForgeGradle downloads,
// writes mixins.aether.refmap.json next to the compiled classes and, through
// reobf, keeps mixin targets correct in the production jar.
// ===========================================================================
mixin {
    // MixinGradle detects ForgeGradle 2.x and sets the obfuscation environment itself.
    // Leaf (a tweaker client) hardcodes "notch" here; Aether is a Forge mod, whose
    // production environment is SRG - MixinGradle 0.6 reads that from ForgeGradle.
    // DSL note: 0.6 takes the refmap name via ext.refMap on the source set (the
    // add-variant silently does nothing - the AP then falls back to a default name
    // under build/tmp, which never ships).
    sourceSets {
        main {
            ext.refMap = "mixins.aether.refmap.json"
        }
    }
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/repository/maven-public"
    }
}

configurations {
    embed
    compile.extendsFrom embed
}

dependencies {
    // Mixin runtime: 0.7.11, NOT 0.8.x. Evidence: Forge 1.8.9's launch classpath is
    // launchwrapper 1.12 + asm-debug-all 5.0.3 (see userdev dev.json) and org.objectweb.asm.*
    // is parent-delegated, so the Mixin runtime must speak ASM 5 - which 0.7.x does and
    // 0.8.x does not (it needs ASM 6+; MixinBootstrap's classpath tricks are out of scope).
    // 0.7.11 is the exact version every proven 1.8.9 Forge client embeds (Leaf included).
    // Embedded into the jar below (the embed configuration exists because FG 2.x also puts
    // Minecraft/Forge on `compile` - embedding `compile` wholesale would ship the game);
    // guava/gson/commons-io stay excluded: the 1.8.9 runtime provides them.
    embed("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        exclude module: "launchwrapper"
        exclude module: "guava"
        exclude module: "gson"
        exclude module: "commons-io"
    }
}

// Mixin 0.8.x embeds its own shaded dependencies; when the mod jar is reobf'd
// ForgeGradle copies the compile dependencies in unless told otherwise. Forge
// 1.8.9 already provides LaunchWrapper and Gson at runtime, and Mixin's shaded
// jar does not need republishing, so nothing extra is bundled by default.

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

jar {
    // Embed the Mixin runtime (shaded classes) - Forge 1.8.9 does not provide one.
    from(configurations.embed.collect {
        it.isDirectory() ? it : zipTree(it)
    }) {
        exclude "META-INF/MUMFREY.RSA",
            "META-INF/maven/**",
            "org/**/*.html"
    }
    manifest {
        attributes(
            "MixinConfigs": "mixins.aether.json",
            // Registers mixins.aether.json in production (CoreModManager discovers
            // coremods by this manifest attribute). In dev runs the equivalent hook
            // is the fml.coreMods.load system property set on the run tasks below;
            // both point at AetherMixinPlugin.
            "FMLCorePlugin": "dev.aether.forge189.mixin.AetherMixinPlugin",
            "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            "TweakOrder": 0,
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true"
        )
    }
}

// =====================================================================
// Headless tests: plain-Java unit tests over the common core (config store,
// module state machines, render maths, freelook/time/zoom views). They are
// main() programs rather than JUnit classes (the project predates a test
// framework on this stack), so :test would "pass" with zero tests executed.
// Instead every compiled *Test class is discovered and run for real; any
// non-zero exit fails the build.
// =====================================================================
task coreSelfTests {
    group = "verification"
    description = "Runs the plain main() self tests over the common core."
    dependsOn tasks.testClasses
    doLast {
        def testClasspath = files(sourceSets.main.output, sourceSets.test.output)
        def scanned = 0
        sourceSets.test.output.classesDirs.each { File dir ->
            if (!dir.isDirectory()) {
                return
            }
            dir.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
                if (!file.name.endsWith("Test.class") || file.name.contains("\$")) {
                    return
                }
                def relName = file.path
                    .substring(dir.path.length() + 1)
                    .replace(File.separator, ".")
                def className = relName.substring(0, relName.length() - ".class".length())
                scanned++
                logger.lifecycle("running " + className)
                javaexec {
                    classpath = testClasspath
                    main = className
                    workingDir = projectDir
                }
            }
        }
        if (scanned == 0) {
            throw new GradleException("coreSelfTests found no *Test classes")
        }
        logger.lifecycle("coreSelfTests: ${scanned} test classes passed")
    }
}
test {
    // No JUnit classes exist; the real suite is coreSelfTests above.
    enabled = false
}
tasks.check {
    dependsOn coreSelfTests
}

// Dev runs: FML discovers the @Mod container reliably only from a jar in
// run/mods (the classpath candidate crawl does not pick it up in this setup).
// The jar must be MCP-named, NOT the reobf'd build/libs artifact: a production
// (SRG) jar in a deobfuscated workspace corrupts class loading - overrides of
// GuiScreen lifecycle methods collide with their remapped names and the mod
// container dies with ClassFormatError/NoClassDefFoundError. So assemble a
// dev-named jar (same manifest, classes straight from build/classes) and drop
// main.output from the game classpath so the jar is the single class source.
task devModJar(type: Jar, dependsOn: tasks.classes) {
    group = "build"
    description = "Assembles the MCP-named mod jar used by runClient."
    baseName = "aether-dev"
    from(sourceSets.main.output) {
        exclude "mcmod.info"
    }
    from(sourceSets.main.resources) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }
    manifest {
        attributes(
            "MixinConfigs": "mixins.aether.json",
            "FMLCorePlugin": "dev.aether.forge189.mixin.AetherMixinPlugin",
            "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            "TweakOrder": 0,
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true"
        )
    }
}
task installModJar(type: Copy, dependsOn: tasks.devModJar) {
    group = "build"
    description = "Copies the dev mod jar into run/mods for dev launches."
    from tasks.devModJar
    into "run/mods"
    doFirst {
        delete fileTree("run/mods") { include "aether-*.jar" }
    }
}
tasks.runClient {
    dependsOn tasks.installModJar
    doFirst {
        // Offline/dev account: -PaetherUsername=<name> launches with that username and no
        // session server, i.e. a cracked/offline-mode account for dev runs. Without it the
        // launchwrapper default ("Player<ticks>") applies.
        if (project.hasProperty("aetherUsername")) {
            args "--username", "${project.property('aetherUsername')}"
            args "--accessToken", "0"
        }
        // TEMPORARY: -PaetherDebugShots=<true|WIDTHxHEIGHT> launches the visual
        // debugger hook; a resolution resizes the window on the first tick.
        if (project.hasProperty("aetherDebugShots")) {
            jvmArgs "-Daether.debugShots=${project.property('aetherDebugShots')}"
        }
        // The mod's classes now come from the jar in run/mods only; leaving
        // build/classes on the classpath would define every class twice.
        classpath = classpath.filter { File f -> !sourceSets.main.output.contains(f) }
    }
}

// Gradle 9 removed the project-level property; set it where it is meaningful.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
