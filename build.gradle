apply plugin: "java"

group = "dev.aether"
version = "0.1.0"

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    // Mixin's annotation processor, only resolved when the refmap step below is enabled.
    maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/maven"
    }
}

def userForgeJar = System.getenv("AETHER_FORGE_189_JAR") ? file(System.getenv("AETHER_FORGE_189_JAR")) : null

// Refmaps are only needed for obfuscated (production) builds, and generating one needs the
// MCP -> SRG mapping file that ForgeGradle keeps in build/mappings. Pass it explicitly with
// -PaetherSrgMappings=/path/to/mcp-srg.srg (or AETHER_SRG_MAPPINGS=...) to turn the step on;
// without it the adapter compiles against MCP names and mixins still work in a dev runtime.
def aetherSrgMappings = System.getenv("AETHER_SRG_MAPPINGS") ?: findProperty("aetherSrgMappings")
def aetherMixinVersion = findProperty("aetherMixinVersion") ?: "0.7.11-SNAPSHOT"
def hasSrgMappings = aetherSrgMappings != null && file(aetherSrgMappings).isFile()
def localForgeJar = file("/home/laptop/.gradle/caches/minecraft/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/stable/22/forgeSrc-1.8.9-11.15.1.2318-1.8.9.jar")

ext.forge189ClasspathJar = (userForgeJar != null && userForgeJar.isFile()) ? userForgeJar : (localForgeJar.isFile() ? localForgeJar : null)

// The processor validates every injection target against the compiled Minecraft classes, so the
// refmap step also needs the real dev jar; against the local stubs it would (correctly) complain.
def canGenerateRefmap = hasSrgMappings && forge189ClasspathJar != null

configurations {
    forge189Libraries {
        canBeConsumed = false
        canBeResolved = true
    }
    mixinProcessor {
        canBeConsumed = false
        canBeResolved = true
    }
}

sourceSets {
    forge189Stubs {
        java.srcDirs = ["src/forge189Stubs/java"]
    }
    forge189 {
        java.srcDirs = ["src/forge189/java"]
        resources.srcDirs = ["src/forge189/resources"]
        compileClasspath += sourceSets.main.output + sourceSets.forge189Stubs.output + configurations.forge189Libraries
        runtimeClasspath += output + compileClasspath
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

tasks.withType(ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    if (forge189ClasspathJar != null) {
        forge189CompileOnly files(forge189ClasspathJar)
        forge189Libraries files(forge189ClasspathJar)
    }
    if (canGenerateRefmap) {
        mixinProcessor "org.spongepowered:mixin:${aetherMixinVersion}"
    }
}

/**
 * Mixin's "searge" obfuscation environment reads a mapping resource named {@code searge.srg}
 * from the processor's classpath, which is how the processor learns the SRG names behind the
 * MCP names our mixins use. This packages the mapping file under that name; the same jar is
 * built by ForgeGradle when it runs the Mixin plugin.
 */
task mixinMappingJar(type: Jar, group: "build") {
    archiveFileName = "mixin-mappings.jar"
    destinationDirectory = file("${buildDir}/mixins")
    if (canGenerateRefmap) {
        from(file(aetherSrgMappings)) {
            rename { "searge.srg" }
        }
    }
}

// Regenerates mixins.aether.refmap.json next to the compiled adapter. The refmap maps the MCP
// names in the mixin sources to SRG names, which is what Mixin needs on an obfuscated runtime.
tasks.named("compileForge189Java") {
    dependsOn mixinMappingJar
    if (canGenerateRefmap) {
        options.compilerArgs += [
            "-AoutRefMapFile=${buildDir}/mixins/mixins.aether.refmap.json",
            "-AdefaultObfuscationEnv=searge"
        ]
        options.annotationProcessorPath = configurations.mixinProcessor + files(mixinMappingJar)
    }
}

compileForge189Java.dependsOn compileForge189StubsJava

test {
    enabled = false
}

task smokeTest(dependsOn: testClasses) {
    def smokeTests = [
        // The prod/dev texture-name resolution the custom font depends on.
        "dev.aether.graphics.TextureIdResolverTest",
        "dev.aether.event.EventBusTest",
        "dev.aether.module.ModuleRegistryTest",
        "dev.aether.config.JsonConfigStoreTest",
        "dev.aether.hud.HudLayoutTest",
        "dev.aether.runtime.PlatformDetectorTest",
        "dev.aether.cosmetic.CosmeticLibraryTest"
    ]

    doLast {
        smokeTests.each { className ->
            javaexec {
                main = className
                classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
            }
        }
    }
}

check.dependsOn smokeTest
check.dependsOn compileForge189Java

// ---------------------------------------------------------------------------------------------
// Production remapping
//
// The adapter is compiled with javac against stubs (or a development Minecraft jar), so its
// constant pool holds development names: drawScreen, WorldRenderer.pos, DynamicTexture.getGlTextureId.
// A production Minecraft 1.8.9 runtime has none of those - ForgeGradle's reobf task is what renames
// them, and a plain Gradle build has nothing that does. An unremapped jar does not just lose a
// feature: the JVM throws NoSuchMethodError the first time such a call site runs, Minecraft never
// dispatches a screen's drawScreen at all, and the mixin targets never resolve.
//
// remapForge189 is that missing step. It rewrites the compiled classes with an SRG mapping file and
// reports every game reference the file does not cover, so a release can refuse to ship a jar that
// would crash on its first frame instead of leaving it to a bug report. The mapping file is the same
// one the Mixin annotation processor consumes above, so one input unlocks both.
//
def nonShippedClasses = [
    // The headless self-tests assert against the build's own stubs: they call members that exist only
    // in the stubs, so shipping them would put classes in the jar that cannot link against Minecraft.
    "**/*SelfTest*.class",
    // The remapper is a build tool, not mod code.
    "dev/aether/remap/**"
]
def remappedClassesDir = file("${buildDir}/remapped")
def requireRemap = Boolean.parseBoolean(
    System.getenv("AETHER_REQUIRE_REMAP") ?: (findProperty("aetherRequireRemap") ?: "false"))

task remapForge189(type: JavaExec) {
    group = "build"
    description = "Rewrites development Minecraft names in the compiled classes into runtime names"
    dependsOn classes, forge189Classes
    onlyIf { hasSrgMappings }
    // The tool writes one file per input class and never deletes, so an output left by an earlier
    // run would leak stale classes into the jar the moment an input set changes.
    doFirst {
        delete remappedClassesDir
    }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "dev.aether.remap.RemapTool"
    args "--mappings", file(aetherSrgMappings).path,
         "--input", sourceSets.main.output.classesDirs.singleFile.path,
         "--input", sourceSets.forge189.output.classesDirs.singleFile.path,
         "--output", remappedClassesDir.path,
         "--report", file("${buildDir}/reports/unmapped-game-references.txt").path,
         // Self-tests and the remapper are compiled but not shipped; they link against this build's
         // stubs, so they have no mapping and must not make a release look unmappable.
         "--exclude", "SelfTest",
         "--exclude", "dev/aether/remap/"
    if (requireRemap) {
        args "--require-complete"
    }
}

/** Fails the build when the artifact still references game members nothing remaps. */
task auditForge189(type: JavaExec) {
    group = "verification"
    description = "Reports game references that production remapping does not cover"
    dependsOn classes, forge189Classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "dev.aether.remap.RemapTool"
    args "--mappings", hasSrgMappings ? file(aetherSrgMappings).path : file("${buildDir}/empty-mappings.srg").path,
         "--input", sourceSets.main.output.classesDirs.singleFile.path,
         "--input", sourceSets.forge189.output.classesDirs.singleFile.path,
         "--output", file("${buildDir}/audit-remapped").path,
         "--report", file("${buildDir}/reports/unmapped-game-references.txt").path,
         "--exclude", "SelfTest",
         "--exclude", "dev/aether/remap/"
    doFirst {
        def placeholder = file("${buildDir}/empty-mappings.srg")
        if (!placeholder.parentFile.exists()) {
            placeholder.parentFile.mkdirs()
        }
        if (!placeholder.exists()) {
            placeholder.text = "# No SRG mapping file was supplied, so this run reports every game reference.\n"
        }
    }
}

task forge189Jar(type: Jar, dependsOn: [classes, forge189Classes]) {
    archiveClassifier = "forge189"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Resources always come from the source sets; only the classes are replaced by the remapped tree.
    from(sourceSets.main.output) {
        exclude "**/*.class"
    }
    from(sourceSets.forge189.output) {
        exclude "**/*.class"
    }
    if (hasSrgMappings) {
        dependsOn remapForge189
        from(remappedClassesDir) {
            exclude nonShippedClasses
        }
    } else {
        from(sourceSets.main.output.classesDirs) {
            exclude nonShippedClasses
        }
        from(sourceSets.forge189.output.classesDirs) {
            exclude nonShippedClasses
        }
        doFirst {
            logger.warn("")
            logger.warn("[Aether] This jar is NOT production-remapped: no SRG mapping file was supplied.")
            logger.warn("[Aether] It carries development Minecraft names, so on a real 1.8.9 client it")
            logger.warn("[Aether] will throw NoSuchMethodError and no Aether screen will be called.")
            logger.warn("[Aether] Build a shippable jar with -PaetherSrgMappings=<path to mcp-srg.srg>")
            logger.warn("[Aether] (-PaetherRequireRemap=true makes this an error).")
            logger.warn("")
        }
    }
    // The refmap generated by the Mixin processor (see mixinMappingJar above). It is only present
    // when the build was given an SRG mapping file, as the config and the mixin targets then agree
    // with the runtime names.
    from("${buildDir}/mixins") {
        include "*.refmap.json"
    }
    // Mixin reads the config list from the jar manifest.
    manifest {
        attributes "MixinConfigs": "mixins.aether.json"
    }
}

assemble.dependsOn forge189Jar
