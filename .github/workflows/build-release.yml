name: Build & Release Aether Client

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, verify & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # The legacy toolchain this project is pinned to: ForgeGradle 2.1 + MixinGradle 0.6
      # only run on Gradle 4.x and Java 8 (see docs/BUILD_PIPELINE_AUDIT.md). The Gradle
      # wrapper resolves 4.10.3 - do NOT raise it without migrating the build first.
      #
      # scripts/verify.sh runs the real gate: build + core self tests + reobfJar, then
      # proves the shipped jar has the refmap (searge table), the mixin config, the
      # Mixin/FMLCorePlugin manifest attributes and zero MCP-named calls into Minecraft.
      # A jar that failed any of those would NoSuchMethodError on a real 1.8.9 client,
      # so failing the build here is the point.
      - name: Build, test & verify production jar
        run: sh scripts/verify.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-client-jar
          path: build/libs/aether-*.jar
          if-no-files-found: error

      - name: Create Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: Aether Client ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build/libs/aether-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
