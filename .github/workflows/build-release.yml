name: Build & Release Aether Client

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      # A jar that ships development Minecraft names throws NoSuchMethodError on a real 1.8.9 client
      # and never has its screens called. Supplying the ForgeGradle SRG mapping file turns the
      # remapping step on and makes the build refuse to publish anything it could not remap; without
      # it the build still runs, but the jar is a development jar (see docs/BUILD_PIPELINE_AUDIT.md).
      - name: Build Aether JAR
        env:
          AETHER_SRG_MAPPINGS: ${{ vars.AETHER_SRG_MAPPINGS }}
        run: |
          export JAVA8_HOME="$JAVA_HOME"
          REQUIRE_REMAP="false"
          if [ -n "$AETHER_SRG_MAPPINGS" ]; then REQUIRE_REMAP="true"; fi
          gradle assemble forge189Jar -PaetherRequireRemap="$REQUIRE_REMAP" --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-client-jar
          path: |
            build/libs/*.jar
            build/reports/unmapped-game-references.txt
          if-no-files-found: warn

      - name: Create Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: Aether Client ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
